<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Импорт авто из Китая и Японии</title>
    <meta
      name="description"
      content="Подбор, выкуп и доставка автомобилей из Китая и Японии. Проверенные дилеры, прозрачная сделка и контроль на каждом этапе."
    />

    <!-- Тема учитывается до отрисовки: иначе при загрузке страницы в тёмной
         теме на мгновение появляется белый экран. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          /* приватный режим браузера: остаёмся на светлой теме */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы платформы нужен включённый JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
