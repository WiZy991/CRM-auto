    <!-- Тема учитывается до отрисовки: иначе при загрузке страницы в тёмной
         теме на мгновение появляется белый экран. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          /* приватный режим браузера: остаёмся на светлой теме */
        }
      })();
    </script>
