# ---------------------------------------------------------------------------
#  Рубеж 1 защиты: единственный контейнер, смотрящий в интернет.
#
#  Задачи этого файла:
#    - обрубать медленные соединения (slowloris / slow POST)
#    - ограничивать частоту запросов и число соединений с одного адреса
#    - не пропускать запросы с некорректным Host и переросшим телом
#    - скрывать версию nginx и служебные пути
#
#  Объёмные L3/L4-атаки здесь НЕ отбиваются — см. docs/SECURITY.md.
# ---------------------------------------------------------------------------

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # --- Логи с временем ответа апстрима: нужны для разбора инцидентов ---
    log_format main escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    reset_timedout_connection on;

    # --- Таймауты: главное средство против slowloris ---
    # Клиент, который открыл соединение и «тянет» заголовки или тело,
    # отбрасывается через 10 секунд вместо удержания воркера навсегда.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     30s;
    keepalive_requests    500;

    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_max_body_size 128k;
    client_body_buffer_size 32k;

    # --- Зоны ограничений ---
    # binary_remote_addr компактнее remote_addr: 10 МБ вмещают ~160 тыс. адресов.
    limit_req_zone  $binary_remote_addr zone=general:16m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:16m      rate=15r/s;
    limit_req_zone  $binary_remote_addr zone=auth:8m      rate=12r/m;
    limit_req_zone  $binary_remote_addr zone=upload:8m    rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=perip:8m;
    limit_conn_zone $server_name        zone=perserver:2m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # --- Сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml;

    # Пустое значение для запросов без Origin, чтобы не отдавать заголовок зря.
    map $http_origin $cors_origin {
        default                       "";
        "~^https?://localhost(:\d+)?$" $http_origin;
    }

    upstream api_backend {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
