# ---------------------------------------------------------------------------
#  Виртуальный хост платформы.
#
#  :80  — ACME (Let's Encrypt), healthz; до выпуска LE отдаёт приложение,
#         после — редирект на HTTPS (см. http-tail.inc из entrypoint).
#  :443 — приложение по TLS
#
#  Сертификаты кладёт gateway-entrypoint.sh в /etc/nginx/certs
#  (Let's Encrypt или временный self-signed до первого выпуска).
# ---------------------------------------------------------------------------

# Заглушка для всего, что пришло не на наш домен: соединение просто закрывается.
server {
    listen 80 default_server;
    listen 443 default_server ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 444;
}

# --- HTTP ---
server {
    listen 80;
    # localhost — для health-check с сервера.
    # Punycode (xn--...) обязателен: клиенты часто шлют Host в ACE-форме.
    server_name localhost
                autoimport.local
                гоуимпорт.рф
                xn--c1akmgcfiqd.xn--p1ai
                *.гоуимпорт.рф
                *.xn--c1akmgcfiqd.xn--p1ai;

    # Выпуск и обновление сертификата Let's Encrypt (HTTP-01).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    # Пишет gateway-entrypoint.sh: либо редирект на https (+ healthz), либо приложение.
    include /etc/nginx/generated/http-tail.inc;
}

# --- HTTPS: основное приложение ---
server {
    listen 443 ssl;
    http2 on;
    server_name localhost
                autoimport.local
                гоуимпорт.рф
                xn--c1akmgcfiqd.xn--p1ai
                *.гоуимпорт.рф
                *.xn--c1akmgcfiqd.xn--p1ai;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: только когда уже есть боевой сертификат (флаг из entrypoint).
    include /etc/nginx/generated/hsts.inc;

    include /etc/nginx/conf.d/app-locations.inc;
}
