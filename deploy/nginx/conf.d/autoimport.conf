# ---------------------------------------------------------------------------
#  Виртуальный хост платформы.
#
#  Запросы без корректного Host обрываются без ответа (default_server ниже) —
#  это отсекает сканеры, которые ходят по IP-адресу.
# ---------------------------------------------------------------------------

# Заглушка для всего, что пришло не на наш домен: соединение просто закрывается.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost autoimport.local;

    limit_conn perip 24;
    limit_conn perserver 2000;

    # --- Заголовки безопасности ---
    # CSP собран под SPA: скрипты только со своего origin, инлайн запрещён.
    # 'unsafe-inline' для style-src оставлен из-за динамических размеров
    # в канбане и графиках; скрипты инлайном не выполняются.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS включается только при работе по TLS, иначе браузер запомнит
    # недоступный https на localhost.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Разрешённые методы ---
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- Явная блокировка типовых сканерных путей ---
    # Первый рубеж отсева: до Go-приложения такие запросы не доходят.
    location ~* /(\.env|\.git|\.svn|\.htaccess|wp-admin|wp-login|phpmyadmin|xmlrpc\.php|vendor/phpunit) {
        access_log off;
        return 444;
    }

    location ~ /\. {
        access_log off;
        deny all;
    }

    # --- Аутентификация: самая жёсткая квота ---
    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=8 nodelay;
        client_max_body_size 16k;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # --- Загрузка файлов: увеличенное тело и отдельная квота ---
    location ^~ /api/v1/uploads {
        limit_req zone=upload burst=10 nodelay;
        client_max_body_size 12m;
        client_body_timeout 60s;
        proxy_request_buffering on;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # --- Остальное API ---
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # --- Отдача загруженных фото ---
    # nosniff + запрет исполнения: даже если в хранилище попадёт файл со
    # скриптом, браузер не выполнит его как HTML.
    location ^~ /files/ {
        limit_req zone=general burst=120 nodelay;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    }

    # --- Метрики Prometheus: только из внутренних сетей ---
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # --- Статика SPA ---
    root /srv/www;
    index index.html;

    location /assets/ {
        limit_req zone=general burst=200 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
